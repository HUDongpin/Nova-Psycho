# Install on the regional host. Replace hostname and certificate paths.
server {
  listen 443 ssl;
  server_name nova-cn.example.com;
  ssl_certificate /etc/ssl/nova/fullchain.pem;
  ssl_certificate_key /etc/ssl/nova/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 600k;
  # Do not log invitation parameters, cookies, authorization headers or request bodies.
  access_log off;
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
}
